<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confirm your Ball Knower account</title>
  </head>
  <body style="margin:0;background:#08090b;color:#ffffff;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#08090b;">
      <tr>
        <td align="center" style="padding:32px 14px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#0e1013;border:1px solid #d4af37;border-radius:18px;">
            <tr>
              <td align="center" style="padding:42px 28px 20px;">
                <div style="font-size:38px;line-height:1;font-weight:900;letter-spacing:-1px;color:#ffffff;">BALL <span style="color:#d4af37;">KNOWER</span></div>
                <div style="margin-top:14px;color:#858892;font-size:12px;font-weight:700;letter-spacing:2px;">ONE ACCOUNT. ONE LEAGUE IDENTITY.</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 28px 8px;">
                <div style="display:inline-block;width:72px;height:72px;line-height:72px;border-radius:18px;background:#d4af37;color:#070809;font-size:38px;font-weight:900;">✓</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 32px 8px;">
                <h1 style="margin:0;color:#ffffff;font-size:28px;line-height:1.15;font-weight:900;">WELCOME TO BALL KNOWER</h1>
                <p style="margin:18px auto 0;max-width:420px;color:#c7c9cf;font-size:16px;line-height:1.55;">Tap below to confirm your email and secure your BK account.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 28px 22px;">
                <a href="{{ .ConfirmationURL }}" style="display:block;max-width:390px;background:#d4af37;color:#070809;text-decoration:none;border-radius:10px;padding:17px 20px;font-size:16px;font-weight:900;letter-spacing:.5px;">CONFIRM MY ACCOUNT</a>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:14px 32px 38px;border-top:1px solid #292b31;">
                <p style="margin:18px 0 8px;color:#858892;font-size:12px;line-height:1.5;">If you didn’t request this, you can safely ignore this email.</p>
                <a href="https://ballknowerofficial.com" style="color:#d4af37;font-size:12px;">ballknowerofficial.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
