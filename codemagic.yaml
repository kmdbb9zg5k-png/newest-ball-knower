workflows:
  ios-app-store:
    name: Ball Knower iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: BallKnowerApple

    environment:
      groups:
        - code-signing
      xcode: 26.6
      node: 22
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ballknower.ios"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        MARKETING_VERSION: "1.0.0"

    scripts:
      - name: Install web and Capacitor dependencies
        script: |
          npm install
          npm install --no-save @capacitor/cli@^8.0.0 @capacitor/ios@^8.0.0

      - name: Run App Store release gate
        script: node scripts/ios-app-store-release-check.mjs

      - name: Build Ball Knower web app
        script: npm run build

      - name: Generate and sync Capacitor iOS project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          test -d "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Generate production iOS app icon
        script: |
          mkdir -p assets
          npm install --no-save sharp@^0.34.0 @capacitor/assets@^3.0.0
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/ball-knower-icon.svg').resize(1024,1024).flatten({background:'#050608'}).png().toFile('assets/icon-only.png')"
          npx capacitor-assets generate --ios
          test -d "$CM_BUILD_DIR/ios/App/App/Assets.xcassets/AppIcon.appiconset"

      - name: Add iOS privacy permissions, auth callback and Apple entitlement
        script: |
          PLIST="$CM_BUILD_DIR/ios/App/App/Info.plist"
          ENTITLEMENTS="$CM_BUILD_DIR/ios/App/App/App.entitlements"
          PBXPROJ="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Ball Knower uses the camera only when you choose to take a profile photo." "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Ball Knower uses the camera only when you choose to take a profile photo." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Ball Knower uses your photo library only when you choose a profile photo." "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Ball Knower uses your photo library only when you choose a profile photo." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.ballknower.ios" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ballknower" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$ENTITLEMENTS"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path=Path(os.environ['CM_BUILD_DIR'])/'ios/App/App.xcodeproj/project.pbxproj'
          text=path.read_text()
          needle='PRODUCT_BUNDLE_IDENTIFIER = com.ballknower.ios;'
          setting='CODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
          if setting not in text:
              text=text.replace(needle,setting+'\n\t\t\t\t'+needle)
          path.write_text(text)
          PY
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PBXPROJ"

      - name: Set up iOS signing keychain
        script: keychain initialize

      - name: Fetch or create Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Install Apple distribution certificate
        script: keychain add-certificates

      - name: Apply App Store provisioning profile
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Set iOS version and build number
        script: |
          cd ios/App
          xcrun agvtool new-marketing-version "$MARKETING_VERSION" || true
          xcrun agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          echo "Generated IPA files:"
          find "$CM_BUILD_DIR" -type f -name "*.ipa" -print

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # Keep automatic publishing off until the exact IPA passes real-device TestFlight QA.
        submit_to_testflight: false
        submit_to_app_store: false
