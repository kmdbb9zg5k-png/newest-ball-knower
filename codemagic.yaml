workflows:
  ios-app-store:
    name: Ball Knower iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: BallKnowerApple

    environment:
      groups:
        - code-signing
      xcode: 26.6
      node: 22
      cocoapods: default
      vars:
        BUNDLE_ID: "com.ballknower.ios"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install web and Capacitor dependencies
        script: |
          npm install
          npm install --no-save @capacitor/core@^8.0.0 @capacitor/cli@^8.0.0 @capacitor/ios@^8.0.0

      - name: Build Ball Knower web app
        script: npm run build

      - name: Generate and sync Capacitor iOS project
        script: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          test -d "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Set up iOS signing keychain
        script: keychain initialize

      - name: Fetch or create Apple signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Install Apple distribution certificate
        script: keychain add-certificates

      - name: Apply App Store provisioning profile
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Set iOS build number
        script: |
          cd ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
