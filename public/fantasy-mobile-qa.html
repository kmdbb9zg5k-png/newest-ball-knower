<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Mobile QA</title>
    <style>
      html,body{margin:0;min-height:100%;background:#202226;color:white;font-family:system-ui,sans-serif}
      body{display:grid;place-items:start center;padding:20px}
      iframe{width:390px;height:844px;border:1px solid #555;border-radius:30px;background:#050608;box-shadow:0 20px 70px #000;overflow:hidden}
    </style>
  </head>
  <body>
    <iframe title="Ball Knower fantasy mobile QA"></iframe>
    <script>
      const screen=new URLSearchParams(location.search).get('screen')||'team';
      const p=(id,name,team,position,ovr=88)=>({id,name,team,teamCity:team,teamName:team,position,positionGroup:position,ovr,overallRating:ovr,salary:1,active:true,attributes:{athleticism:ovr,footballIQ:ovr}});
      const mine=[
        p('ea-21033','Jalen Hurts','PHI','QB',82),p('ea-13085','Saquon Barkley','PHI','RB',92),p('qa-bijan','Bijan Robinson','ATL','RB',94),
        p('qa-ajb','A.J. Brown','PHI','WR',95),p('ea-20961','Justin Jefferson','MIN','WR',94),p('qa-kelce','Travis Kelce','KC','TE',90),
        p('ea-12556','Christian McCaffrey','SF','RB',97),p('qa-aubrey','Brandon Aubrey','DAL','K',86),p('qa-phi-dst','Philadelphia Eagles D/ST','PHI','DST',89),
        p('qa-lamar','Lamar Jackson','BAL','QB',96),p('qa-gibbs','Jahmyr Gibbs','DET','RB',96),p('qa-chase','Ja\'Marr Chase','CIN','WR',98),
        p('qa-arsb','Amon-Ra St. Brown','DET','WR',95),p('qa-bowers','Brock Bowers','LV','TE',94),p('qa-den-dst','Denver Broncos D/ST','DEN','DST',90)
      ];
      const pools=[
        [p('ea-12635','Patrick Mahomes','KC','QB',93),p('qa-lamb','CeeDee Lamb','DAL','WR',95),p('qa-cook','James Cook','BUF','RB',91)],
        [p('qa-allen','Josh Allen','BUF','QB',95),p('qa-puka','Puka Nacua','LAR','WR',94),p('qa-taylor','Jonathan Taylor','IND','RB',93)],
        [p('qa-burrow','Joe Burrow','CIN','QB',94),p('qa-hill','Tyreek Hill','MIA','WR',91),p('qa-henry','Derrick Henry','BAL','RB',92)],
        [p('qa-daniels','Jayden Daniels','WAS','QB',91),p('qa-nabers','Malik Nabers','NYG','WR',90),p('qa-achane','De\'Von Achane','MIA','RB',91)],
        [p('qa-love','Jordan Love','GB','QB',87),p('qa-wilson','Garrett Wilson','NYJ','WR',89),p('qa-jacobs','Josh Jacobs','GB','RB',90)],
        [p('qa-herbert','Justin Herbert','LAC','QB',88),p('qa-evans','Mike Evans','TB','WR',90),p('qa-williams','Kyren Williams','LAR','RB',89)],
        [p('qa-stroud','C.J. Stroud','HOU','QB',86),p('qa-smith','DeVonta Smith','PHI','WR',89),p('qa-breece','Breece Hall','NYJ','RB',88)]
      ];
      const names=['Elijah’s Playmakers','Gridiron Kings','Sunday Savages','Fourth & Wrong','No Punt Intended','Two Minute Warning','End Zone Empire','The Waiver Wire'];
      const members=names.map((name,index)=>({id:index===0?'qa-me':`qa-${index+1}`,userId:index===0?'user-default-1':`cpu-${index}`,userName:name,isCommissioner:index===0,isAi:index!==0,status:'ready',roster:index===0?mine:pools[index-1],waiverPriority:index+1}));
      const orderMemberIds=members.map(member=>member.id);
      const picks=[
        ['qa-me','ea-21033','QB'],['qa-2','ea-12635','QB'],['qa-3','qa-allen','QB'],['qa-4','qa-burrow','QB'],
        ['qa-5','qa-daniels','QB'],['qa-6','qa-love','QB'],['qa-7','qa-herbert','QB'],['qa-8','qa-stroud','QB']
      ].map((pick,index)=>({overall:index+1,round:1,memberId:pick[0],playerId:pick[1],group:pick[2],pickedAt:new Date().toISOString(),source:index?'cpu':'manual'}));
      const completed=screen!=='draft';
      const league={id:'demo-league-instance',code:'BK-77492',name:'Sunday Gridiron Fantasy League',maxMembers:8,salaryCap:200,commissionerId:'user-default-1',commissionerName:'Elijah',status:'drafting',members,createdAt:new Date().toISOString(),settings:{seasonGames:17,regularSeasonWeeks:15,currentWeek:2,fantasySeasonStarted:completed,scoringFormat:'ppr',nflSeason:2026,waiverType:'faab',freeAgentMode:'instant',irSlots:2,benchSlots:6,rosterSize:15,playoffTeams:6,draftOrderMethod:'random'},liveDraft:{leagueId:'demo-league-instance',status:completed?'completed':'active',orderMemberIds,rounds:15,pickIndex:picks.length,picks,startedAt:new Date().toISOString(),pickSeconds:60,pickStartedAt:new Date().toISOString(),pickDeadlineAt:new Date(Date.now()+45000).toISOString(),updatedAt:new Date().toISOString()}};
      localStorage.setItem('ballknower_user_v1',JSON.stringify({id:'user-default-1',name:'Elijah',email:'guest@ballknower.local',avatarUrl:'',createdAt:new Date().toISOString()}));
      localStorage.setItem('ballknower_leagues_v1',JSON.stringify([league]));
      localStorage.setItem('ballknower_active_league_id_v1','demo-league-instance');
      localStorage.setItem('ball-knower-team-setup-v2','PHI');
      document.querySelector('iframe').src=`/?fantasy-visual-qa=${encodeURIComponent(screen)}`;
    </script>
  </body>
</html>
