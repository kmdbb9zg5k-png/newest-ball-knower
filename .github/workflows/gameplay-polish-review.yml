name: Gameplay polish review
on:
  pull_request:
    paths:
      - 'public/play-moment-3d/**'
      - 'public/play-moment-3d-preview.html'
      - 'scripts/check-gameplay-polish.mjs'
      - 'scripts/check-carry-control.mjs'
      - 'scripts/check-catch-controls.mjs'
      - '.github/workflows/gameplay-polish-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-football-foundation.mjs
      - run: node scripts/check-football-pursuit.mjs
      - run: node scripts/check-catch-controls.mjs
        env:
          BK_REVIEW_OUT: artifacts/carry-control-48
      - run: node scripts/check-carry-control.mjs
        env:
          BK_REVIEW_OUT: artifacts/carry-control-48
      - run: node scripts/check-gameplay-polish.mjs
        env:
          BK_REVIEW_OUT: artifacts/carry-control-48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-control-48
          path: artifacts/carry-control-48
