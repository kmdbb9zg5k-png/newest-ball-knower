name: Stadium graphics review
on:
  pull_request:
    paths:
      - 'public/play-moment-3d/**'
      - 'public/play-moment-3d-preview.html'
      - 'scripts/check-stadium-presentation.mjs'
      - 'scripts/check-football-scene.mjs'
      - '.github/workflows/stadium-graphics-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate controller recording regressions
        run: node scripts/check-football-recovery.mjs
      - name: Render blocking contact and manual catch sequence
        run: node scripts/check-gameplay-contact.mjs
        env:
          BK_SCENE_OUT: artifacts/live-camera-38/contact
      - name: Compare actual goal-line rendering
        run: node scripts/check-stadium-presentation.mjs
        env:
          BK_BASELINE_REF: c079e9b792ff1601ca27e143657bf1164b65581b
          BK_SCENE_OUT: artifacts/live-camera-38/comparison
      - name: Validate mobile formations and missing-art fallback
        run: node scripts/check-football-scene.mjs
        env:
          BK_SCENE_OUT: artifacts/live-camera-38/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-camera-38-webgl
          path: artifacts/live-camera-38
          retention-days: 14
