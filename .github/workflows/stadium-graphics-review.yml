name: Stadium graphics review
on:
  pull_request:
    paths:
      - 'public/play-moment-3d/**'
      - 'public/play-moment-3d-preview.html'
      - 'scripts/check-stadium-presentation.mjs'
      - 'scripts/check-graphics-followup.mjs'
      - 'scripts/check-football-graphics.mjs'
      - 'scripts/check-football-motion.mjs'
      - 'scripts/check-contact-possession.mjs'
      - 'scripts/check-gameplay-contact.mjs'
      - 'scripts/check-football-recovery.mjs'
      - 'scripts/check-football-scene.mjs'
      - '.github/workflows/stadium-graphics-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate controller recording regressions
        run: node scripts/check-football-recovery.mjs
      - name: Validate scoring sightlines
        run: node scripts/check-graphics-followup.mjs
      - name: Validate post-play motion and stationary hand fighting
        run: node scripts/check-football-motion.mjs
        env:
          BK_MOTION_OUT: artifacts/contact-possession-42/motion
      - name: Validate failed tackles, interceptions and scrolling titles
        run: node scripts/check-contact-possession.mjs
        env:
          BK_CONTACT_OUT: artifacts/contact-possession-42/possession
      - name: Validate actual GPU player surfaces
        run: node scripts/check-football-graphics.mjs
        env:
          BK_GRAPHICS_OUT: artifacts/contact-possession-42/players
      - name: Compare actual goal-line rendering
        run: node scripts/check-stadium-presentation.mjs
        env:
          BK_BASELINE_REF: 9c6d946074f1557eff1fa4dbafca8f6605b5cb32
          BK_SCENE_OUT: artifacts/contact-possession-42/comparison
      - uses: actions/upload-artifact@v4
        with:
          name: contact-possession-42-comparison
          path: artifacts/contact-possession-42/comparison
          retention-days: 14
      - name: Render blocking contact and manual catch sequence
        run: node scripts/check-gameplay-contact.mjs
        env:
          BK_SCENE_OUT: artifacts/contact-possession-42/contact
      - name: Validate mobile formations and missing-art fallback
        run: node scripts/check-football-scene.mjs
        env:
          BK_SCENE_OUT: artifacts/contact-possession-42/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-possession-42-webgl
          path: artifacts/contact-possession-42
          retention-days: 14
