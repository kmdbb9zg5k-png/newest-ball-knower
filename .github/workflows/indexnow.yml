name: Notify search engines with IndexNow

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - public/**/*.html
      - public/robots.txt
      - public/sitemap.xml
      - public/llms.txt
      - public/manifest.webmanifest
      - public/seo.css
      - public/1aa664e2f715ece0f5c3bedcfc833943.txt
      - .github/workflows/indexnow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production SEO files
        env:
          INDEXNOW_KEY: 1aa664e2f715ece0f5c3bedcfc833943
        run: |
          set -euo pipefail
          key_url="https://ballknowerofficial.com/${INDEXNOW_KEY}.txt"
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --location "$key_url" || true)"
            if [ "$body" = "$INDEXNOW_KEY" ]; then
              echo "IndexNow key is live on production."
              exit 0
            fi
            echo "Waiting for production deployment (${attempt}/30)..."
            sleep 10
          done
          echo "Production did not expose the IndexNow key in time."
          exit 1

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 1aa664e2f715ece0f5c3bedcfc833943
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location \
            'https://ballknowerofficial.com/sitemap.xml' \
            --output /tmp/sitemap.xml

          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import xml.etree.ElementTree as ET

          host = 'ballknowerofficial.com'
          key = os.environ['INDEXNOW_KEY']
          root = ET.parse('/tmp/sitemap.xml').getroot()
          urls = []

          for node in root.iter():
              if node.tag.endswith('loc') and node.text:
                  url = node.text.strip()
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme == 'https' and parsed.netloc == host:
                      urls.append(url)

          urls = list(dict.fromkeys(urls))
          if not urls:
              raise SystemExit('No valid production URLs found in sitemap.xml')
          if len(urls) > 10000:
              raise SystemExit('IndexNow submission exceeds the 10,000 URL limit')

          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'https://{host}/{key}.txt',
              'urlList': urls,
          }
          with open('/tmp/indexnow.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          print(f'Prepared {len(urls)} sitemap URLs for IndexNow.')
          PY

          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary '@/tmp/indexnow.json')"
          cat /tmp/indexnow-response.txt || true
          echo "IndexNow HTTP status: ${status}"
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            exit 1
          fi
