name: Apply Franchise rookie protection

on:
  push:
    branches:
      - fix/franchise-rookie-protection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/franchise-rookie-protection
      - name: Protect same-draft rookies and My Player
        shell: python
        run: |
          from pathlib import Path
          path = Path('soloFranchiseEngine.ts')
          text = path.read_text()
          old = '''export function replaceFranchisePlayersWithRookies(roster: Player[], rookies: Player[]): Player[] {
            const next = [...roster];
            for (const rookie of rookies) {
              if (next.some(player => player.id === rookie.id)) continue;
              const group = getDraftPositionGroup(rookie);
              if (!group) continue;
              const replacement = next
                .map((player, index) => ({ player, index }))
                .filter(entry => getDraftPositionGroup(entry.player) === group)
                .sort((first, second) => first.player.ovr - second.player.ovr || first.player.name.localeCompare(second.player.name))[0];
              if (replacement) next[replacement.index] = rookie;
            }
            return next;
          }'''
          new = '''export function replaceFranchisePlayersWithRookies(roster: Player[], rookies: Player[]): Player[] {
            const next = [...roster];
            const insertedRookieIds = new Set<string>();
            const protectedPlayerIds = new Set(['my-player-user']);
            for (const rookie of rookies) {
              if (next.some(player => player.id === rookie.id)) continue;
              const group = getDraftPositionGroup(rookie);
              if (!group) continue;
              const replacement = next
                .map((player, index) => ({ player, index }))
                .filter(entry => getDraftPositionGroup(entry.player) === group
                  && !insertedRookieIds.has(entry.player.id)
                  && !protectedPlayerIds.has(entry.player.id))
                .sort((first, second) => first.player.ovr - second.player.ovr || first.player.name.localeCompare(second.player.name))[0];
              if (replacement) {
                next[replacement.index] = rookie;
                insertedRookieIds.add(rookie.id);
              }
            }
            return next;
          }'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected rookie replacement function was not found')
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run lint
          node --import tsx scripts/integrity-check.ts
          npm run build
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add soloFranchiseEngine.ts
          git commit -m "Protect Franchise rookies and My Player"
          git push origin HEAD:fix/franchise-rookie-protection
