name: Validated fantasy scoring
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/bk/*scoring*'
      - 'scripts/fantasy-canonical-scoring-check.ts'
      - 'scripts/postgres-fantasy-scoring-integration.sql'
      - 'scripts/postgres-fantasy-lineup-writes-integration.sql'
      - 'migrations/*atomic_validated_fantasy_scoring.sql'
      - 'migrations/*secure_fantasy_lineup_writes.sql'
      - '.github/workflows/fantasy-scoring-postgres.yml'
jobs:
  atomic-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical source contract and arithmetic
        run: node --import tsx scripts/fantasy-canonical-scoring-check.ts
      - name: Real PostgreSQL atomic scoring and correction fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-fantasy-scoring-integration.sql
      - name: Authenticated lineup writes and kickoff locks
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-fantasy-lineup-writes-integration.sql
