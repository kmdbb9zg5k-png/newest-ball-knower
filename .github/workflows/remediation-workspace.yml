name: Release verification source snapshot
on:
  push:
    branches: [maintenance/app-store-remediation-workspace]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 9ab6adf744e61eeb192d05ba8fe06d6e92ecca25
      - name: Package committed source only
        run: git archive --format=tar HEAD | gzip > /tmp/ball-knower-current-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ball-knower-current-source
          path: /tmp/ball-knower-current-source.tar.gz
          retention-days: 1
