name: Football source and release evidence
on:
  push:
    branches: [maintenance/app-store-remediation-workspace]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect explicit public sources; no credentials or private records
        shell: bash
        run: |
          mkdir -p /tmp/source-evidence
          python3 - <<'PY'
          import urllib.request, json, hashlib, datetime
          from pathlib import Path
          out=Path('/tmp/source-evidence')
          urls={
            'roster_2026.csv':'https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_2026.csv',
            'stats_player_reg_2025.csv':'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_reg_2025.csv',
            'stats_player_week_2025.csv':'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv',
            'stats_team_reg_2025.csv':'https://github.com/nflverse/nflverse-data/releases/download/stats_team/stats_team_reg_2025.csv',
            'depth_charts_2026.csv':'https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2026.csv',
            'LICENSE.md':'https://raw.githubusercontent.com/nflverse/nflverse-data/master/LICENSE.md',
            'old-domain-health.txt':'https://ballknower.com/api/health',
            'production-health.txt':'https://ballknowerofficial.com/api/health',
          }
          manifest=[]
          for name,url in urls.items():
            row={'file':name,'source':url,'retrievedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'BallKnower-release-source-verification/1.0'})
              with urllib.request.urlopen(req,timeout=35) as response:
                data=response.read(30000000)
                row.update(status=response.status,finalUrl=response.url,contentType=response.headers.get('Content-Type'),sha256=hashlib.sha256(data).hexdigest(),bytes=len(data))
              (out/name).write_bytes(data)
            except Exception as error: row['error']=str(error)
            manifest.append(row)
            print(name,row.get('status'),row.get('bytes'),row.get('error'))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ball-knower-source-evidence
          path: /tmp/source-evidence
          retention-days: 1
