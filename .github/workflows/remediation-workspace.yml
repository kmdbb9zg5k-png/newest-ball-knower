name: Verify historical football identities
on:
  push:
    branches: [maintenance/app-store-remediation-workspace]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve explicit public roster releases
        run: |
          mkdir -p /tmp/identity-evidence
          python3 - <<'PY'
          import urllib.request, json, hashlib
          from pathlib import Path
          out=Path('/tmp/identity-evidence'); records=[]
          for season in [2025,2024]:
            url=f'https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_{season}.csv'
            with urllib.request.urlopen(url,timeout=45) as r: data=r.read()
            assert len(data)<15000000
            (out/f'roster_{season}.csv').write_bytes(data)
            records.append({'source':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ball-knower-historical-identities
          path: /tmp/identity-evidence
          retention-days: 1
