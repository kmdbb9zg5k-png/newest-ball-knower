name: Independent football sources
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx scripts/independent-sources-check.ts
      - run: node --import tsx scripts/generate-independent-published-data.ts --check
      - run: node scripts/release-backend-preflight.mjs --self-test
      - name: Verify transactional source install preserves historical records
        env:
          PGPASSWORD: postgres
        run: |
          node scripts/prepare-independent-sources-fixture.mjs
          psql -h 127.0.0.1 -U postgres -d postgres -f /tmp/bk-independent-sources.sql
