name: News release source snapshot
on:
  push:
    branches: [maintenance/news-release-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba6b5ec3738c0267ed14cac0a34d664c4526f28d
          persist-credentials: false
      - name: Package exact committed source
        run: |
          git archive --format=tar HEAD | gzip > /tmp/news-release-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: news-release-source
          path: /tmp/news-release-source.tar.gz
          retention-days: 1
