name: All-screen visual source snapshot
on:
  push:
    branches: [maintenance/news-release-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1dc206fa28d854c9cad317cc0c957538ddfea2c
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/all-screens-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: all-screens-source
          path: /tmp/all-screens-source.tar.gz
          retention-days: 1
