name: Home visual preview source snapshot
on:
  push:
    branches: [maintenance/news-release-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 564ec557ab6753b210679fc90eef0bb4ca26f9a8
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > /tmp/home-preview-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: home-preview-source
          path: /tmp/home-preview-source.tar.gz
          retention-days: 1
