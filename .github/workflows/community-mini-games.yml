name: Community mini-game browser checks
on:
  pull_request:
    branches: [main]
    paths:
      - '*.tsx'
      - '*.ts'
      - '*.css'
      - 'combine/**'
      - 'public/play-moment-3d/**'
      - 'public/play-moment-3d-preview.html'
      - 'public/player-controls.js'
      - 'scripts/*athlete*'
      - 'scripts/*competition*'
      - 'scripts/*control*'
      - 'scripts/*ghost*'
      - 'scripts/mini-challenges-browser.mjs'
      - 'scripts/my-player-field*'
      - 'scripts/full-game-control-settings-browser.mjs'
      - 'scripts/check-presentation-clock.mjs'
      - 'scripts/check-reference-contact.mjs'
      - '.github/workflows/community-mini-games.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-mini-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Check progression, challenge rules, controls and replay validation
        run: |
          node --import tsx scripts/mini-challenges-check.ts
          node --import tsx scripts/athlete-passport-check.ts
          node --import tsx scripts/control-preferences-check.ts
          node --import tsx scripts/competition-rules-check.ts
          node scripts/check-reference-contact.mjs
          node scripts/dash-ghost-check.mjs
          node --import tsx scripts/my-player-field-check.ts
  mobile-browser:
    needs: rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [athlete-creator, mini-challenges, athlete-locker, control-settings, dash-ghost, competition-arena, my-player-field, full-game-control-settings, presentation-clock]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use installed Chrome or install Chromium
        timeout-minutes: 5
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            echo "BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise mobile layouts and feature interactions
        shell: bash
        run: |
          if [ "${{ matrix.suite }}" = presentation-clock ]; then
            node scripts/check-presentation-clock.mjs
          else
            node scripts/${{ matrix.suite }}-browser.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-${{ matrix.suite }}-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
