name: Solo artwork fidelity audit
on:
  push:
    branches: [fix/solo-art-fidelity-audit]
permissions:
  contents: read
concurrency:
  group: solo-art-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for reproducible review
        run: |
          mkdir -p /tmp/solo-audit-snapshot
          git archive --format=tar.gz HEAD > /tmp/solo-audit-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/solo-audit-snapshot/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: solo-art-audit-source
          path: /tmp/solo-audit-snapshot
          retention-days: 3
