name: Ball Knower Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/**

permissions:
  contents: read

jobs:
  database-trigger-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Exercise heterogeneous notification triggers in PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-trigger-integration.sql

      - name: Exercise private league RLS and league creation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-league-privacy-integration.sql

      - name: Preserve canonical games across provider ID changes
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-live-schedule-integration.sql

      - name: Enforce profile-photo storage and profile ownership
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-profile-photo-integration.sql

      - name: Preserve leagues during account deletion
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f scripts/postgres-account-deletion-integration.sql

  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and roster integrity
        run: npm run check:hardening

      - name: Require all six fantasy league sizes
        run: |
          npm run check:draft-reliability > /tmp/draft-reliability.json
          for size in 6 8 10 12 14 16; do
            grep -q '"teams": '"$size" /tmp/draft-reliability.json
          done

      - name: Generate authoritative Draft Order Game catalog
        run: npx tsx scripts/generate-draft-order-game-catalog.ts /tmp/20260825_update_draft_order_game_salary_estimates.sql

      - name: Verify frozen catalog migration
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s /tmp/20260825_update_draft_order_game_salary_estimates.sql migrations/20260825_update_draft_order_game_salary_estimates.sql; then
            echo "The canonical player source no longer matches the already-applied catalog migration."
            echo "Do not rewrite migrations/20260825_update_draft_order_game_salary_estimates.sql."
            echo "Create a new versioned catalog migration and apply it to production instead."
            diff -u migrations/20260825_update_draft_order_game_salary_estimates.sql /tmp/20260825_update_draft_order_game_salary_estimates.sql | head -n 200 || true
            exit 1
          fi
          echo "Frozen Draft Order Game catalog matches canonical source."

      - name: Upload generated Draft Order Game catalog for inspection
        uses: actions/upload-artifact@v4
        with:
          name: draft-order-game-catalog
          path: /tmp/20260825_update_draft_order_game_salary_estimates.sql
          retention-days: 1

  fantasy-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Enforce initial JavaScript bundle budget
        run: npm run check:root-bundle

      - name: Verify fantasy mobile layouts
        run: npm run check:fantasy-mobile-browser

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-mobile-ui
          path: artifacts/fantasy-mobile-ui
          if-no-files-found: ignore
          retention-days: 7
