name: Ball Knower Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/**

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and roster integrity
        run: npm run check:hardening
