name: Ball Knower Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/**

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and roster integrity
        run: npm run check:hardening

      - name: Generate authoritative Draft Order Game catalog
        run: npx tsx scripts/generate-draft-order-game-catalog.ts /tmp/20260825_secure_draft_order_game_catalog.sql

      - name: Upload generated Draft Order Game catalog
        uses: actions/upload-artifact@v4
        with:
          name: draft-order-game-catalog
          path: /tmp/20260825_secure_draft_order_game_catalog.sql
          retention-days: 1

      - name: Commit canonical catalog to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/20260825_secure_draft_order_game_catalog.sql migrations/20260825_secure_draft_order_game_catalog.sql
          git add migrations/20260825_secure_draft_order_game_catalog.sql
          if git diff --cached --quiet; then
            echo "Canonical catalog already matches the generated source."
            exit 0
          fi
          git config user.name "ball-knower-hardening[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate canonical Draft Order Game catalog"
          git push origin "HEAD:${{ github.head_ref }}"
