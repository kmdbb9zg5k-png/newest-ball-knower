name: Ball Knower Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/**

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and roster integrity
        run: npm run check:hardening

      - name: Generate authoritative Draft Order Game catalog
        run: npx tsx scripts/generate-draft-order-game-catalog.ts /tmp/20260825_secure_draft_order_game_catalog.sql

      - name: Upload generated Draft Order Game catalog
        uses: actions/upload-artifact@v4
        with:
          name: draft-order-game-catalog
          path: /tmp/20260825_secure_draft_order_game_catalog.sql
          retention-days: 1
