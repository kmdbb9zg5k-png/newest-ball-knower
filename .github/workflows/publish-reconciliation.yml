name: Prepare scoped reconciliation branches
on:
  push:
    branches: [maintenance/reconciliation-workspace-20260911]
    paths: [.github/workflows/publish-reconciliation.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: staging
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: 0f2a6c1391179d6dfabdbe356fd5d5458affd401
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Preserve current source and selected historical inputs
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p ../out ../old187 ../old188
          git archive --format=tar.gz HEAD > ../out/current-main.tgz
          git fetch --depth=1 origin 3db2f4cfe07dbdcd6f4342e448ef23130d2d6356 520726327485d556a3fa2ccc4ef6efdb198266ea
          git archive 3db2f4cfe07dbdcd6f4342e448ef23130d2d6356 fantasyDraftReport.ts scripts/fantasy-draft-report-edge-check.ts docs/tasks/2026-09-02-fantasy-draft-report-depth.md | tar -x -C ../old187
          git archive 520726327485d556a3fa2ccc4ef6efdb198266ea fantasyLiveScoring.ts scripts/fantasy-live-scoring-reliability-check.ts docs/tasks/2026-09-02-fantasy-player-data-completeness.md | tar -x -C ../old188
      - name: Reconcile only the missing fantasy improvements
        working-directory: app
        run: |
          set -euo pipefail
          git switch -c feat/fantasy-reconciliation-verified-20260911
          export BK_ROOT="$PWD" BK_OLD187="$PWD/../old187" BK_OLD188="$PWD/../old188"
          python3 ../staging/.reconciliation/port.py
          cp .github/workflows/hardening.yml ../out/proposed-hardening.yml
          # This token can write source, not workflows. Workflow integration is
          # preserved as an artifact for the authorized connector write.
          git restore --source=HEAD -- .github/workflows/hardening.yml
          git add FantasyDraftAnalysis.tsx fantasyDraftReport.ts LeagueLiveDraftRoom.tsx fantasyLiveScoring.ts api/fantasy-live-scoring.ts fantasyGameLogStats.ts FantasyPlayerDetail.tsx package.json scripts/fantasy-draft-report-edge-check.ts scripts/fantasy-draft-report-depth-check.ts scripts/fantasy-player-data-completeness-check.ts scripts/fantasy-live-scoring-reliability-check.ts scripts/fantasy-reconciliation-browser-check.mjs docs/tasks/2026-09-02-fantasy-draft-report-depth.md docs/tasks/2026-09-02-fantasy-player-data-completeness.md docs/qa/2026-09-11-fantasy-reconciliation.md
          git diff --cached --check
          git diff --cached --binary > ../out/fantasy-changes.patch
          git diff --cached --name-only -z | tar --null -T - -czf ../out/fantasy-changed-files.tgz
      - name: Install dependencies and execute complete source regression
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check:hardening 2>&1 | tee ../out/hardening.log
          npm run build > ../out/build.log 2>&1
          npm run check:root-bundle | tee ../out/bundle.log
      - name: Publish source branch only after successful checks
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name 'Ball Knower Engineering'
          git config user.email 'engineering@ballknowerofficial.com'
          git commit -m 'feat: reconcile draft reports and complete player game logs on current main'
          git push origin HEAD:feat/fantasy-reconciliation-verified-20260911
          git rev-parse HEAD > ../out/source-head.txt
      - name: Preserve inspectable source and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-recovery
          path: out
          if-no-files-found: error
          retention-days: 3
