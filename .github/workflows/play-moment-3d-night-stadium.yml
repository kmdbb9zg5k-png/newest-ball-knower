name: 3D practice night stadium
on:
  push:
    branches: [feat/play-moment-3d-practice-preview]
    paths:
      - 'public/play-moment-3d/**'
      - 'public/play-moment-3d-preview.html'
      - 'scripts/check-play-moment-night-stadium.*'
      - 'scripts/check-play-moment-night.py'
      - 'scripts/check-play-moment-framing.*'
      - '.github/workflows/play-moment-3d-night-stadium.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-night-stadium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Geometry, budgets and board orientation
        run: node scripts/check-play-moment-night-stadium.mjs
      - name: Camera framing and clustered receiver markers
        run: node scripts/check-play-moment-framing.mjs
      - run: python -m pip install playwright==1.57.0 pillow
      - run: python -m playwright install --with-deps chromium
      - name: Render offline stadium fixtures at three screen sizes
        run: python scripts/check-play-moment-night-stadium.py --output artifacts/night-stadium
      - name: Exercise playable camera-relative cuts and night renderer
        run: BK_NIGHT_RESULTS=artifacts/night-game python scripts/check-play-moment-night.py 932 430
      - name: Compare camera and HUD and exercise enlarged target hit areas
        run: python scripts/check-play-moment-framing.py --baseline-ref HEAD^ --output artifacts/framing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-stadium-fixtures
          path: artifacts
          if-no-files-found: ignore
          retention-days: 3
