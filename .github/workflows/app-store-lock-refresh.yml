name: App Store Lock Refresh

on:
  push:
    branches: [app-store-release-prep]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refreshed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-store-release-prep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "Ball Knower Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh iOS release dependency lockfile [lock-refreshed]"
          git push origin HEAD:app-store-release-prep
