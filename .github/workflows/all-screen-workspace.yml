name: Build and inspect all-screen broadcast rollout
on:
  push:
    branches: [maintenance/all-screen-broadcast-workspace]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: instructions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: app
          ref: b1dc206fa28d854c9cad317cc0c957538ddfea2c
      - name: Apply checked presentation-only edits on the approved Home baseline
        run: |
          python3 - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          raw=Path('instructions/.all-screen/edits.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='2659e4c585f06c7bd30f1a7e45e373093fe17f0e7545079719ffe3d09fd3fe09','Patch transport differs'
          items=json.loads(raw)
          for item in items:
              name=Path(item['path'])
              assert not name.is_absolute() and not set(name.parts)&{'.git','.github','..'}
              dest=Path('app')/name;text=dest.read_text()
              for edit in reversed(item['edits']):text=text[:edit['start']]+edit['text']+text[edit['end']:]
              dest.write_text(text)
          manifest=''.join(i['path']+':'+hashlib.sha256((Path('app')/i['path']).read_bytes()).hexdigest()+'\n' for i in sorted(items,key=lambda i:i['path']))
          assert hashlib.sha256(manifest.encode()).hexdigest()=='9fb065c7ef017d4e38eaaa1f0ad07c56ba699c574e2f3450069b7c156533694c','Result differs from locally checked implementation'
          for name in ['BroadcastScene.tsx','broadcastFocus.ts','broadcastScreens.css','public/atmosphere/office-suite.webp','scripts/all-screens-broadcast-check.ts','scripts/all-screens-broadcast-browser.mjs','docs/design/ALL_SCREENS_BROADCAST.md']:
              dest=Path('app')/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(Path('instructions')/name,dest)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Verify actual route, state and presentation contracts
        working-directory: app
        run: |
          npm run lint
          npm run check:home-dashboard
          npm run check:nfl-news
          node --import tsx scripts/all-screens-broadcast-check.ts
          npm run check:ios-release
      - run: npm run build && npm run check:root-bundle
        working-directory: app
      - name: Publish isolated implementation for full PR checks
        working-directory: app
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin refs/heads/design/all-screen-broadcast)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Extend approved broadcast atmosphere to all existing app destinations with focus-safe motion'
          git push origin HEAD:refs/heads/design/all-screen-broadcast
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Inspect actual screens using public provider output and isolated account state
        working-directory: app
        run: node scripts/all-screens-broadcast-browser.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-screen-broadcast-evidence
          path: app/artifacts/all-screens
          if-no-files-found: ignore
          retention-days: 3
