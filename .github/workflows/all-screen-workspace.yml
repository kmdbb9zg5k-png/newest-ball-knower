name: Verify final all-screen visual polish
on:
  push:
    branches: [maintenance/all-screen-broadcast-workspace]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20ad129b8a567bb69a6746ca6e7e5e9a13e32879
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Apply small reviewed corrections without altering gameplay
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          def replace(file,old,new):
              p=Path(file);t=p.read_text();assert t.count(old)==1,(file,old);p.write_text(t.replace(old,new))
          replace('scripts/fantasy-mobile-browser-check.mjs',"const header=document.querySelector('header');","const header=document.querySelector('body > header');")
          replace('scripts/fantasy-mobile-browser-check.mjs',"name:'Ball Knower Profile'","name:'Your Locker'")
          replace('ModeGuide.tsx','className="inline-flex min-h-11','className="bk-mode-guide-button inline-flex min-h-11')
          replace('BroadcastScene.tsx','<div ref={ref} className={`bk-screen','<div className={`bk-screen')
          replace('BroadcastScene.tsx','<div className="bk-scene-backdrop"','<div ref={ref} className="bk-scene-backdrop"')
          p=Path('broadcastScreens.css');t=p.read_text().replace('.bk-scene-actions>button:has(.lucide-circle-help)','.bk-scene-actions>.bk-mode-guide-button')
          t+='''\n/* Keep help controls compact despite the base button font reset. */
          .bk-screen .bk-mode-guide-button { min-height:40px; padding:0 10px; gap:6px; font-size:10px; font-weight:800; line-height:1.4; letter-spacing:.035em; flex-shrink:0; }
          .bk-screen .bk-mode-guide-button svg { width:16px; height:16px; }
          .bk-scene-actions>.bk-mode-guide-button { min-width:40px; padding-inline:0; justify-content:center; font-size:0; gap:0; }
          '''
          p.write_text(t)
          p=Path('public/atmosphere/office-suite.webp');image=Image.open(p);assert image.size==(210,205)
          image.crop((0,8,210,205)).save(p,format='WEBP',quality=85,method=6)
          replace('docs/design/ALL_SCREENS_BROADCAST.md','210x205 crop (x790,y307 to x1000,y512)','210x197 text-free crop (x790,y315 to x1000,y512; eight upper pixels trimmed from the existing WebP)')
          p=Path('scripts/all-screens-broadcast-browser.mjs');t=p.read_text();anchor="assert.equal(await page.locator('.bk-news-story').count(),news.articles.length);assert.equal(await page.locator('.bk-news-story img').count(),0);"
          assert t.count(anchor)==1
          t=t.replace(anchor,anchor+'''
            if(width<768&&news.articles.length>10){
             await page.evaluate(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'}));
             const backdrop=await page.locator('.bk-scene-backdrop').boundingBox();
             if(backdrop&&backdrop.y+backdrop.height<=0)await page.waitForFunction(()=>document.querySelector('.bk-screen[data-page="news"]')?.getAttribute('data-motion')==='off');
             await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
             await page.waitForFunction(()=>document.querySelector('.bk-screen[data-page="news"]')?.getAttribute('data-motion')==='on');
            }
          ''');p.write_text(t)
          print('Text-free office asset SHA-256:',hashlib.sha256(Path('public/atmosphere/office-suite.webp').read_bytes()).hexdigest())
          PY
      - run: npm run lint && node --import tsx scripts/all-screens-broadcast-check.ts
      - run: npm run build && npm run check:root-bundle
      - run: npx playwright install --with-deps chromium
      - name: Retest existing mobile fantasy and profile-photo behavior
        run: npm run check:fantasy-mobile-browser
      - name: Recheck all real pages and capture final live-headline evidence
        run: node scripts/all-screens-broadcast-browser.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-screen-final-evidence
          path: |
            artifacts/all-screens
            artifacts/fantasy-mobile-ui
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish only the tested presentation branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/design/all-screen-broadcast | cut -f1)" = '20ad129b8a567bb69a6746ca6e7e5e9a13e32879'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BroadcastScene.tsx ModeGuide.tsx broadcastScreens.css public/atmosphere/office-suite.webp docs/design/ALL_SCREENS_BROADCAST.md scripts/all-screens-broadcast-browser.mjs scripts/fantasy-mobile-browser-check.mjs
          git commit -m 'Polish compact help controls, clean office artwork and verify actual mobile profile flows'
          git push origin HEAD:refs/heads/design/all-screen-broadcast
