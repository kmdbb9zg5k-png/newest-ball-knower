name: Verify corrected Home visual preview
on:
  push:
    branches: [maintenance/home-visual-workspace]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49ce86fecb06c7202ee974a7e6187ac0770f9884
      - name: Apply focused Home-only typography fix and guide-aware test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('Navbar.tsx');text=path.read_text()
          old='aria-label="Primary navigation" className='
          assert text.count(old)==1
          path.write_text(text.replace(old,'aria-label="Primary navigation" data-home-broadcast={currentTab===\'home\'?\'true\':undefined} className='))
          path=Path('homeBroadcast.css')
          path.write_text(path.read_text()+'''\n
          /* The base stylesheet has an unlayered button font reset. Keep Home labels
             compact without changing any other mode's navigation. */
          nav[data-home-broadcast="true"] button { font-family: inherit; font-size: 9px; font-weight: 800; line-height: 1.25; letter-spacing: .06em; }
          nav[data-home-broadcast="true"] button svg { width: 21px; height: 21px; }
          ''')
          path=Path('scripts/home-broadcast-browser-check.mjs');text=path.read_text()
          old="if(width<768)assert.equal(await page.getByRole('navigation',{name:'Primary navigation'}).locator('button').count(),5);"
          assert text.count(old)==1
          text=text.replace(old,"""if(width<768){
             const buttons=page.getByRole('navigation',{name:'Primary navigation'}).locator('button');
             assert.equal(await buttons.count(),5);
             assert.ok((await buttons.evaluateAll(items=>items.map(e=>parseFloat(getComputedStyle(e).fontSize)))).every(size=>size>=8&&size<=11),'Bottom labels must remain compact and readable');
            }""")
          old="await page.locator('.bk-app-shell[data-tab=\"fantasy\"]').waitFor();"
          assert text.count(old)==1
          text=text.replace(old,old+"""
             // The destination shell mounts before its lazy-loaded first-visit guide.
             // Wait for the real guide and close it normally, never click through it.
             const guideClose=page.getByRole('button',{name:'Close instructions',exact:true});
             await guideClose.waitFor();await guideClose.click();
             await page.getByRole('dialog',{name:'Fantasy HQ instructions',exact:true}).waitFor({state:'hidden'});""")
          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run check:home-dashboard && node --import tsx scripts/home-broadcast-check.ts && npm run check:ios-release
      - run: npm run build && npm run check:root-bundle
      - run: npx playwright install --with-deps chromium
      - name: Check actual mobile controls and capture live-headline screen/video
        run: node scripts/home-broadcast-browser-check.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-broadcast-corrected-preview
          path: artifacts/home-broadcast
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish only the verified preview branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/design/home-stadium-preview | cut -f1)" = '49ce86fecb06c7202ee974a7e6187ac0770f9884'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Navbar.tsx homeBroadcast.css scripts/home-broadcast-browser-check.mjs
          git commit -m 'Fix compact Home navigation labels and verify real mobile controls'
          git push origin HEAD:refs/heads/design/home-stadium-preview
